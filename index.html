<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lafiamed Quiz Portal</title>

    <style>
        /* A. GLOBAL RESET & BASE */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8f9fa; 
            overflow: hidden; /* Fixes mobile scroll-bounce issues */
        }

        /* B. THE APP STAGE (CENTERING ENGINE) */
        .app-stage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; 
            height: 100%;
            width: 100%;
            padding: 8vh 7vw; 
            z-index: 10;
        }

        /* C. BACKGROUND ECG ELEMENT */
        .background-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .main-ecg-line {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            opacity: 0.25;
        }

        /* D. LOGO BOX DESIGN */
        .logo-box {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 120px; 
            height: 120px;
            background: transparent; 
            border: 3px solid #1abc9c; /* Blue-Green Border */
            border-radius: 24px;
            flex-shrink: 0; 
        }

        /* E. TYPOGRAPHY & GRADIENTS */
        .content-stack {
            text-align: center;
            width: 100%;
            max-width: 500px;
        }
        .lafiamed-title {
            margin: 0;
            font-size: clamp(2.8rem, 12vw, 4rem); 
            font-weight: 900;
            background: linear-gradient(45deg, #1abc9c, #21467A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }
        .subtitle {
            margin-top: 20px;
            color: #6c757d;
            font-size: clamp(1.2rem, 5vw, 1.5rem);
            line-height: 1.6;
            font-weight: 500;
        }

        /* F. THE GOLDEN BUTTON */
        .button-zone {
            width: 100%;
            display: flex;
            justify-content: center;
            padding-bottom: 8vh;
        }
        .google-btn {
            background-color: #ffffff;
            color: #3c4043;
            font-weight: 700;
            border: 2.5px solid #D4AF37; /* Gold border */
            padding: 20px 32px;
            width: 100%;
            max-width: 340px;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            font-size: 1.2rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            transition: all 0.2s ease;
        }
        .google-btn:active {
            transform: scale(0.95);
            background-color: #f1f3f4;
        }

        /* G. LANDSCAPE OPTIMIZATION */
        @media (orientation: landscape) {
            .app-stage { padding: 4vh 5vw; }
            .logo-box { width: 80px; height: 80px; }
            .lafiamed-title { font-size: 2.5rem; }
            .subtitle { font-size: 1.1rem; margin-top: 10px; }
            .google-btn { padding: 14px 28px; }
        }
    </style>
</head>
<body>

    <div class="background-layer">
        <svg class="main-ecg-line" width="100%" height="150" viewBox="0 0 1000 150" preserveAspectRatio="none">
            <path d="M0,75 L440,75 L450,20 L465,130 L480,45 L495,75 L1000,75" 
                  fill="none" stroke="#ff9999" stroke-width="3" />
        </svg>
    </div>

    <div class="app-stage">
        
        <div class="logo-box">
            <svg width="100" height="100" viewBox="0 0 64 64" overflow="visible">
                <defs>
                    <linearGradient id="lm-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#1abc9c;" /> 
                        <stop offset="100%" style="stop-color:#21467A;" />
                    </linearGradient>
                </defs>
                <path d="M-40,44 L-10,44 L-4,30 L4,58 L12,38 L18,44 L46,44 L52,30 L60,58 L68,38 L74,44 L110,44" 
                      fill="none" stroke="#ff9999" stroke-width="3" stroke-linejoin="round" />
                <text x="32" y="38" text-anchor="middle" dominant-baseline="middle" 
                      font-family="sans-serif" font-size="30" font-weight="900" fill="url(#lm-gradient)">LM</text>
            </svg>
        </div>

        <div class="content-stack">
            <h2 class="lafiamed-title">Lafiamed Access</h2>
            <p class="subtitle">Securely log in with Google to continue your medical study journey.</p>
        </div>

        <div class="button-zone">
            <button class="google-btn" id="googleLoginBtn">
                <svg width="24" height="24" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Continue with Google
            </button>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // CONFIG BLOCK: Fill these with your Firebase project keys
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // STARTUP
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // THE TRIGGER
        document.getElementById('googleLoginBtn').addEventListener('click', () => {
            console.log("Attempting OAuth...");
            signInWithPopup(auth, provider)
                .then((result) => {
                    alert(`Access Granted: Welcome ${result.user.displayName}`);
                })
                .catch((error) => {
                    console.error("Auth Error:", error.code);
                    alert("Authentication Error. Check Firebase Console configuration.");
                });
        });
    </script>

</body>
</html>
